<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0d0d1a"/>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#fbb040"/>
      <stop offset="55%"  stop-color="#F7931A"/>
      <stop offset="100%" stop-color="#c97010"/>
    </linearGradient>
  </defs>

  <!-- Row 1: two full bricks -->
  <rect x="2"  y="3"  width="12" height="7" rx="1.5" fill="url(#g)"/>
  <rect x="18" y="3"  width="12" height="7" rx="1.5" fill="url(#g)"/>

  <!-- Row 2: half · full · half (offset) -->
  <rect x="2"  y="13" width="5"  height="7" rx="1.5" fill="url(#g)" opacity="0.85"/>
  <rect x="10" y="13" width="12" height="7" rx="1.5" fill="url(#g)" opacity="0.9"/>
  <rect x="25" y="13" width="5"  height="7" rx="1.5" fill="url(#g)" opacity="0.85"/>

  <!-- Row 3: same as row 1, dimmer -->
  <rect x="2"  y="23" width="12" height="7" rx="1.5" fill="url(#g)" opacity="0.55"/>
  <rect x="18" y="23" width="12" height="7" rx="1.5" fill="url(#g)" opacity="0.55"/>
</svg>
